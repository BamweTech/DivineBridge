<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Divine Bridge</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f7fa;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        h1 {
            color: #0066cc;
            font-size: 28px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #666;
            font-size: 12px;
            margin-bottom: 30px;
        }
        .message {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #0066cc;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #0052a3;
        }
        .button.secondary {
            background-color: #e0e0e0;
            color: #333;
        }
        .button.secondary:hover {
            background-color: #d0d0d0;
        }
        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #dc3545;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Divine Bridge</h1>
        <p class="subtitle">Uniting Hearts in Global Prayer</p>
        
        <div class="message">
            <p>We're sorry to see you go. Please enter your email address to unsubscribe from Divine Bridge daily prayers.</p>
        </div>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/unsubscribe">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" value="{{ email }}" required>
            </div>
            
            <div class="button-container">
                <button type="submit" class="button">Continue</button>
                <a href="/" class="button secondary">Cancel</a>
            </div>
        </form>
        
        <div class="footer">
            <p>If you have any questions, please contact us at <a href="mailto:{{ sender_email }}" style="color: #0066cc; text-decoration: none;">{{ sender_email }}</a></p>
        </div>
    </div>
</body>
</html>
