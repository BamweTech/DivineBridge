<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Divine Bridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f5c542;
            --blue: #1f3c88;
            --black: #1e1e1e;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: var(--black);
            background: linear-gradient(to bottom right, var(--white), #e6f0ff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--gold);
            padding: 1rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--gold);
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--black);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        /* Signup Section */
        .signup-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 4rem;
        }

        .signup-container {
            background: var(--white);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .signup-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2rem;
            color: var(--black);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 500;
            color: var(--black);
        }

        .form-group input {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .terms {
            font-size: 0.9rem;
            color: var(--black);
            opacity: 0.8;
        }

        .terms a {
            color: var(--blue);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .terms a:hover {
            color: var(--gold);
        }

        .signup-button {
            background: linear-gradient(to right, var(--blue), var(--gold));
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .signup-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(to right, var(--gold), var(--blue));
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .login-link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: var(--gold);
        }

        /* Footer */
        .footer {
            background: var(--black);
            color: var(--white);
            padding: 2rem;
            text-align: center;
        }

        .footer-logo {
            color: var(--gold);
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: var(--white);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-links a:hover {
            color: var(--gold);
        }

        .copyright {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .signup-section {
                padding: 6rem 1rem 2rem;
            }

            .signup-container {
                padding: 2rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav-container">
            <a href="/" class="logo">
                <span>Divine Bridge</span>
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/prayers">Prayers</a>
                <a href="/login">Login</a>
                <a href="/signup">Sign Up</a>
            </div>
        </nav>
    </header>

    <!-- Signup Section -->
    <section class="signup-section">
        <div class="signup-container">
            <h1 class="signup-title">Create Account</h1>
            <form class="signup-form" id="signupForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                <div class="terms">
                    By signing up, you agree to our <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
                </div>
                <button type="submit" class="signup-button">Create Account</button>
            </form>
            <div class="login-link">
                Already have an account? <a href="/login">Log in</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-logo">Divine Bridge</div>
        <div class="footer-links">
            <a href="/about">About</a>
            <a href="/prayers">Prayers</a>
            <a href="/privacy">Privacy Policy</a>
        </div>
        <div class="copyright">
            &copy; 2025 Divine Bridge. All rights reserved.
        </div>
    </footer>

    <script>
        // Add scroll-based header effect
        window.addEventListener('scroll', function() {
            const header = document.querySelector('.header');
            if (window.scrollY > 50) {
                header.style.background = 'rgba(255, 255, 255, 0.95)';
            } else {
                header.style.background = 'var(--white)';
            }
        });

        // Password validation
        function validatePassword(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };
            return requirements;
        }

        // Update password requirements display
        function updatePasswordRequirements(password) {
            const requirements = validatePassword(password);
            Object.keys(requirements).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.style.color = requirements[key] ? 'green' : 'red';
                }
            });
        }

        // Handle form submission
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            // Validate password strength
            const requirements = validatePassword(password);
            if (!Object.values(requirements).every(Boolean)) {
                alert('Password does not meet all requirements');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        firstName,
                        lastName,
                        email,
                        password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('Account created successfully! Please check your email to verify your account.');
                    window.location.href = '/login';
                } else {
                    // Display specific error message
                    if (data.field) {
                        const errorElement = document.getElementById(data.field + 'Error');
                        if (errorElement) {
                            errorElement.textContent = data.error;
                            errorElement.style.display = 'block';
                        }
                    } else {
                        alert(data.error || 'Failed to create account');
                    }
                }
            } catch (error) {
                alert('An error occurred. Please try again.');
                console.error('Error:', error);
            }
        });

        // Add password requirement validation on input
        document.getElementById('password').addEventListener('input', function(e) {
            updatePasswordRequirements(e.target.value);
        });
    </script>
</body>
</html>
