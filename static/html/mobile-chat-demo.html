<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mobile Chat Demo - Divine Bridge</title>
    <link rel="stylesheet" href="../css/prayer-room-mobile-teams-modern.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <div class="prayer-room-container">
        <div class="prayer-room-interface">
            <!-- HEADER -->
            <div class="prayer-room-header">
                <div class="header-content">
                    <div class="header-title">
                        <h2>Prayer Room</h2>
                    </div>
                    <div class="header-actions">
                        <div class="control-buttons">
                            <button class="control-btn join-audio-btn" title="Join Audio">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4"></path></svg>
                            </button>
                            <button class="control-btn mute-btn" title="Mute">
                                <svg class="mic-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path><path d="M17 16.91c-1.48 1.46-3.51 2.36-5.77 2.36-2.26 0-4.29-.9-5.77-2.36M9 18.9v2.04c0 .21.17.38.38.39C9.77 21.46 10.88 22 12 22s2.23-.54 2.62-.67c.21-.01.38-.18.38-.39v-2.04"></path></svg>
                                <svg class="muted-icon" style="display:none;" fill="currentColor" viewBox="0 0 24 24"><path d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.40 22.99 3.50612381,23.1 4.13399899,22.99 L17.1272231,14.0454487 C17.1272231,13.5741566 16.6915026,12.6315722 16.6915026,12.4744748 Z"></path><path d="M21.714504,11 L21.714504,3.50612381 C21.714504,2.87824862 21.1272231,2.40612381 20.5,2.40612381 C19.3946707,2.40612381 18.4521864,3.34862381 18.4521864,4.45381566 L18.4521864,11 L21.714504,11 Z M14.1946707,0.994750656 C14.1946707,0.338439555 13.5272231,-0.1 12.7399899,0.0570974236 L3.50612381,8.47416199 C3.03399899,8.78809958 2.99,9.20716199 2.99,9.50612381 L0.994750656,0.0570974236 L0.994750656,8 C0.994750656,8.99 1.46612381,9.89 2.40612381,10.3613922 L3.34862381,10.3613922 Z"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- CONTENT -->
            <div class="prayer-room-content">
                <!-- CHAT PANEL -->
                <div class="chat-panel" style="transform: translateX(0) !important; opacity: 1 !important; pointer-events: auto !important; z-index: 2 !important;">
                    <div class="chat-section">
                        <div class="chat-header"></div>
                        <div class="chat-messages">
                            <!-- Message 1 - Other user -->
                            <div class="message message-other">
                                <div class="message-bubble">
                                    <span class="message-sender">John</span>
                                    <span class="message-content">Hey, how are you doing today?</span>
                                    <span class="message-time">9:30 AM</span>
                                </div>
                            </div>
                            
                            <!-- Message 2 - Own message -->
                            <div class="message message-own">
                                <div class="message-bubble">
                                    <span class="message-sender">You</span>
                                    <span class="message-content">I'm doing great, thanks for asking! Just finished prayer and feeling blessed.</span>
                                    <span class="message-time">9:31 AM</span>
                                </div>
                            </div>
                            
                            <!-- Message 3 - Other user -->
                            <div class="message message-other">
                                <div class="message-bubble">
                                    <span class="message-sender">Sarah</span>
                                    <span class="message-content">That's wonderful! We should pray together sometime</span>
                                    <span class="message-time">9:32 AM</span>
                                </div>
                            </div>
                            
                            <!-- Message 4 - Own message -->
                            <div class="message message-own">
                                <div class="message-bubble">
                                    <span class="message-sender">You</span>
                                    <span class="message-content">Absolutely! I'd love that</span>
                                    <span class="message-time">9:32 AM</span>
                                </div>
                            </div>
                            
                            <!-- Message 5 - System notification -->
                            <div class="message system-notification">
                                <div class="message-bubble">
                                    <span class="system-message">John joined the room</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- CHAT INPUT -->
            <div class="chat-input-section">
                <div class="chat-input-container">
                    <input type="text" class="chat-input" placeholder="Type a message...">
                    <button class="send-btn" title="Send message">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7m0 0l-7 7m7-7H6"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- BOTTOM TABS -->
        <div class="mobile-bottom-tabs">
            <button class="active">
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>Room</span>
            </button>
            <button>
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12h-4v4h-4v-4H4v-4h4V4h4v4h4v4z"></path></svg>
                <span>Chat</span>
            </button>
            <button>
                <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
                <span>People</span>
            </button>
        </div>
    </div>
    
    <script>
        // Simulate header height calculation
        const updateMobileHeaderOffset = () => {
            const header = document.querySelector('.prayer-room-header');
            if (!header) return;
            
            const rect = header.getBoundingClientRect();
            const headerHeight = rect.height;
            const headerBottom = rect.bottom;
            
            document.documentElement.style.setProperty('--header-height', `${headerHeight}px`);
            document.documentElement.style.setProperty('--mobile-header-offset', `${headerBottom}px`);
            
            console.log(`Header height: ${headerHeight}px, Bottom: ${headerBottom}px`);
        };
        
        // Call on load and resize
        window.addEventListener('load', updateMobileHeaderOffset);
        window.addEventListener('resize', updateMobileHeaderOffset);
        
        // Call immediately
        setTimeout(updateMobileHeaderOffset, 100);
        
        // Handle chat input
        const chatInput = document.querySelector('.chat-input');
        const sendBtn = document.querySelector('.send-btn');
        
        chatInput.addEventListener('focus', () => {
            document.body.classList.add('chat-input-focused');
        });
        
        chatInput.addEventListener('blur', () => {
            document.body.classList.remove('chat-input-focused');
        });
        
        sendBtn.addEventListener('click', () => {
            if (chatInput.value.trim()) {
                // Create new message
                const messagesContainer = document.querySelector('.chat-messages');
                const newMessage = document.createElement('div');
                newMessage.className = 'message message-own';
                newMessage.innerHTML = `
                    <div class="message-bubble">
                        <span class="message-sender">You</span>
                        <span class="message-content">${chatInput.value}</span>
                        <span class="message-time">Just now</span>
                    </div>
                `;
                messagesContainer.appendChild(newMessage);
                chatInput.value = '';
                
                // Scroll to bottom
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        });
        
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
