{% extends "base.html" %}

{% block title %}Divine Bridge - Forgot Password{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 400px;
        margin: 8rem auto 4rem;
        padding: 2rem;
        background: var(--white);
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .auth-title {
        font-family: 'Poppins', sans-serif;
        font-size: 2rem;
        color: var(--black);
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        font-weight: 500;
        color: var(--black);
    }

    .form-group input {
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1rem;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--gold);
    }

    .auth-button {
        background: var(--gold);
        color: var(--black);
        padding: 1rem;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .auth-button:hover {
        transform: translateY(-2px);
    }

    .auth-links {
        text-align: center;
        margin-top: 1.5rem;
    }

    .auth-links a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 500;
    }

    .auth-links a:hover {
        text-decoration: underline;
    }

    .error-message {
        color: #dc3545;
        text-align: center;
        margin-bottom: 1rem;
    }

    .success-message {
        color: #28a745;
        text-align: center;
        margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
        .auth-container {
            margin: 6rem 1rem 2rem;
            padding: 1.5rem;
        }

        .auth-title {
            font-size: 1.8rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1 class="auth-title">Reset Password</h1>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="success-message">{{ success }}</div>
    {% endif %}
    <form class="auth-form" method="POST" action="{{ url_for('auth.forgot_password') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="auth-button">Send Reset Link</button>
    </form>
    <div class="auth-links">
        <p>Remember your password? <a href="{{ url_for('auth.login') }}">Log In</a></p>
    </div>
</div>
{% endblock %}
