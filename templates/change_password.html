{% extends "base.html" %}

{% block title %}Divine Bridge - Change Password{% endblock %}

{% block extra_css %}
<style>
    .change-password-section {
        padding: 8rem 2rem 4rem;
        max-width: 800px;
        margin: 0 auto;
    }

    .change-password-title {
        font-family: 'Poppins', sans-serif;
        font-size: 2.5rem;
        color: var(--black);
        text-align: center;
        margin-bottom: 3rem;
    }

    .change-password-form {
        background: var(--white);
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-weight: 500;
        color: var(--black);
        margin-bottom: 0.5rem;
    }

    .form-group input {
        width: 100%;
        padding: 0.8rem;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1rem;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--gold);
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }

    .form-button {
        flex: 1;
        padding: 1rem;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s ease;
    }

    .save-button {
        background: var(--gold);
        color: var(--black);
    }

    .cancel-button {
        background: #6c757d;
        color: var(--white);
    }

    .form-button:hover {
        transform: translateY(-2px);
    }

    .error-message {
        color: #dc3545;
        text-align: center;
        margin-bottom: 1rem;
    }

    .success-message {
        color: #28a745;
        text-align: center;
        margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
        .change-password-section {
            padding: 6rem 1rem 2rem;
        }

        .change-password-title {
            font-size: 2rem;
        }

        .change-password-form {
            padding: 1.5rem;
        }

        .form-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="change-password-section">
    <h1 class="change-password-title">Change Password</h1>
    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}
    {% if success %}
    <div class="success-message">{{ success }}</div>
    {% endif %}
    <form class="change-password-form" method="POST" action="{{ url_for('auth.change_password') }}">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="form-button save-button">Change Password</button>
            <a href="/profile" class="form-button cancel-button">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
