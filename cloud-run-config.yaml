apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: divinebridge
  namespace: divinebridge
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "50"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-connector: projects/divinebridge/locations/us-central1/connectors/divinebridge-vpc
    spec:
      containers:
      - image: gcr.io/divinebridge/divinebridge:latest
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: "2"
            memory: "1Gi"
          requests:
            cpu: "1"
            memory: "512Mi"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: FLASK_APP
          value: "app.py"
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /_ah/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /_ah/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 15
      timeoutSeconds: 300
      containerConcurrency: 16
      serviceAccountName: divinebridge-sa 