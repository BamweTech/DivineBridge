# Auto-deploy to staging on merge to develop branch.
# Uses a separate Cloud Run service and Firebase project for isolation.
name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to staging Cloud Run
        run: |
          gcloud run deploy divinebridge-staging \
            --source . \
            --region us-central1 \
            --project divinebridge \
            --set-env-vars FLASK_ENV=staging \
            --allow-unauthenticated \
            --quiet

      - name: Deploy Firestore rules to staging
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only firestore \
            --project divinebridge \
            --token "$FIREBASE_TOKEN" || true
